name: Validate Flinkboot #194

on:
  push:
    branches:
      - fix/194-null-commandline-arguments

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Run full Maven test suite
        run: mvn -B clean test
